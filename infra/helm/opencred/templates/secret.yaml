{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opencred.fullname" . }}-secrets
  labels:
    {{- include "opencred.labels" . | nindent 4 }}
  annotations:
    # Keeps `helm upgrade` from regenerating the secrets below and invalidating
    # every session and every encrypted issuer key.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  database-url: {{ include "opencred.databaseUrl" . | quote }}
  valkey-url: {{ include "opencred.valkeyUrl" . | quote }}

  {{/*
    Generated once if not supplied, then preserved on upgrade by reading back
    the live Secret. ENCRYPTION_KEY in particular is not a rotatable value in
    place: it decrypts stored issuer private keys, and losing it means every
    organisation's signing key becomes unreadable.
  */}}
  {{- $existing := (lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" (include "opencred.fullname" .))) }}
  jwt-secret: {{ .Values.secrets.jwtSecret | default (and $existing (index $existing.data "jwt-secret" | b64dec)) | default (randAlphaNum 64) | quote }}
  encryption-key: {{ .Values.secrets.encryptionKey | default (and $existing (index $existing.data "encryption-key" | b64dec)) | default (randAlphaNum 64) | quote }}

  {{- if eq .Values.storage.driver "s3" }}
  {{- if not .Values.storage.s3.existingSecret }}
  s3-access-key-id: {{ .Values.storage.s3.accessKeyId | quote }}
  s3-secret-access-key: {{ .Values.storage.s3.secretAccessKey | quote }}
  {{- end }}
  {{- end }}

  {{- if and .Values.mail.user (not .Values.mail.existingSecret) }}
  mail-password: {{ .Values.mail.password | quote }}
  {{- end }}
{{- end }}
