{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opencred.serviceAccountName" . }}
  labels:
    {{- include "opencred.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# OpenCred never calls the Kubernetes API, so its pods have no reason to carry a
# mountable API token.
automountServiceAccountToken: false
{{- end }}
{{- if .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "opencred.fullname" . }}
  labels:
    {{- include "opencred.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "opencred.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
